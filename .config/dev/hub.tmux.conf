# The frame `dev hub` draws in: a tmux server of its own (tmux -L hub), whose
# one window holds the session list (dev-hub, left) and a nested client of
# the real session being shown (right). Sessions themselves live on the
# default server, under ~/.config/tmux/tmux.conf as ever.
# See vault: projects/project-machine-continuity.md (#17)

# No prefix: every key reaches the session inside, C-a and all. The hub's own
# keys are the few Alt bindings below.
set -g prefix None
set -g prefix2 None

set -g status off
set -g mouse on
set -g focus-events on
set -sg escape-time 10
set -g history-limit 2000

# Panes here only ever run tmux attach, dev and dev-hub, and they are started
# by sh: an interactive fish would only slow each one down.
set -g default-shell /bin/sh

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,ghostty:Tc"
# dev-hub picks its palette depth from this, as gitview does.
set-environment -g COLORTERM truecolor

# Copies from inside a session pass through to the Mac you are at, as OSC 52
# (see the same lines in ~/.config/tmux/tmux.conf).
set -g set-clipboard on
set -as terminal-overrides ',*:Ms=\E]52;c%p1%.0s;%p2%s\7'

set -g set-titles on
set -g set-titles-string "[#{host_short}] hub"

# The hub outlives its clients; a session ending inside it is handled by the
# sidebar, which shows another.
set -g destroy-unattached off
set -g detach-on-destroy on
set -g remain-on-exit off
# The sidebar alone stays on exit (dev-hub sets that on its own pane), so a
# crashed one is brought straight back.
set-hook -g pane-died "respawn-pane"

# ⌥1–9 jump, ⌥{ ⌥} back and forward: handed to the sidebar, the leftmost
# pane, wherever the keyboard is. ⌥0 puts the keyboard on the list.
bind -n M-0 select-pane -t "{left}"
bind -n M-1 send-keys -t "{left}" M-1
bind -n M-2 send-keys -t "{left}" M-2
bind -n M-3 send-keys -t "{left}" M-3
bind -n M-4 send-keys -t "{left}" M-4
bind -n M-5 send-keys -t "{left}" M-5
bind -n M-6 send-keys -t "{left}" M-6
bind -n M-7 send-keys -t "{left}" M-7
bind -n M-8 send-keys -t "{left}" M-8
bind -n M-9 send-keys -t "{left}" M-9
bind -n "M-{" send-keys -t "{left}" "M-{"
bind -n "M-}" send-keys -t "{left}" "M-}"
