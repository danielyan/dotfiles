# tmux config — primarily for the always-on Mini, where long-running sessions
# hold active work between attaches from the Air.
# See vault: projects/project-machine-continuity.md

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Long scrollback: a Claude session left running for days accumulates output.
set -g history-limit 100000

# Ghostty reports truecolor; without this, colours degrade over ssh.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,ghostty:Tc"

# Escape delay breaks vim/fish vi-mode responsiveness over ssh.
set -sg escape-time 10
set -g focus-events on

# Keep the session alive and detect dead clients when the Air's lid closes.
set -g destroy-unattached off
# Ending a session (exit in its last shell) disconnects, back to the Air. Off,
# tmux moved the client into whichever other session was running instead.
set -g detach-on-destroy on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# Copies reach the clipboard of the Mac you are sitting at through OSC 52,
# not pbcopy: inside a `dev` session pbcopy runs on the Mini and fills the
# Mini's clipboard. Mouse drags end the same way (tmux's default binding).
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Send copies to the terminal as OSC 52, and let programs inside tmux (nvim,
# Claude Code) do the same.
set -g set-clipboard on
# tmux sends OSC 52 with an empty selection (\e]52;;...), which mosh drops:
# it only forwards the "c" (clipboard) form. Name it explicitly; Ghostty takes
# that form directly too.
set -as terminal-overrides ',*:Ms=\E]52;c%p1%.0s;%p2%s\7'

# The terminal tab names the machine and the folder: "[mini] magpie". Claude
# Code and fish set titles of their own, but those only reach the pane title
# (#T), which this leaves out.
set -g set-titles on
set -g set-titles-string "[#{host_short}] #{b:pane_current_path}"

set -g status-position top
set -g status-style "bg=default fg=colour245"
set -g status-left "#[fg=colour114,bold] #S #[default]"
set -g status-right "#[fg=colour245]#H "
set -g status-left-length 30
setw -g window-status-current-style "fg=colour180,bold"
